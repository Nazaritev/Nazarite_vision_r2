map_server:
  ros__parameters:
    use_sim_time: false
    frame_id: map
    topic_name: map

amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /scan
    map_topic: /map
    tf_broadcast: true
    robot_model_type: nav2_amcl::OmniMotionModel
    set_initial_pose: false
    alpha1: 0.35
    alpha2: 0.35
    alpha3: 0.35
    alpha4: 0.35
    alpha5: 0.35
    laser_model_type: likelihood_field
    laser_min_range: 0.45
    laser_max_range: 10.0
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    min_particles: 500
    max_particles: 3000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.5
    z_rand: 0.5
    sigma_hit: 0.2

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    behavior_plugins: [spin, backup, wait]

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      rolling_window: false
      resolution: 0.05
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      obstacle_layer:
        scan:
          topic: /scan
          data_type: LaserScan
          min_obstacle_height: -0.15
          max_obstacle_height: 4.0
          inf_is_valid: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      rolling_window: true
      resolution: 0.05
      obstacle_layer:
        scan:
          topic: /scan
          data_type: LaserScan
          min_obstacle_height: -0.15
          max_obstacle_height: 4.0
          inf_is_valid: true

controller_server:
  ros__parameters:
    use_sim_time: false
    grab_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 3.15
      stateful: true
    MPPI_Long:
      vx_max: 2.0
      vx_min: -2.0
      vy_max: 2.0
      vy_min: -2.0
      wz_max: 0.25

    TEB_Short:
      max_vel_x: 0.2
      max_vel_x_backwards: 0.2
      max_vel_y: 0.2
      max_vel_theta: 0.25

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    feedback: OPEN_LOOP
    max_velocity: [2.0, 2.0, 0.0]
    min_velocity: [-2.0, -2.0, 0.0]
    max_accel: [3.5, 3.5, 0.0]
    max_decel: [-4.0, -4.0, -0.0]
    velocity_timeout: 1.0
