lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ['controller_server',
                 'planner_server',
                 'behavior_server',
                 'bt_navigator',
                 'global_costmap/global_costmap',
                 'local_costmap/local_costmap']

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /Odometry
    bt_loop_duration: 10
    default_bt_xml_filename: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.1
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      allow_unknown: true
      motion_model: "OMNI"
      radius: 0.25
      analytical_expansion: true
      analytical_expansion_max_length: 3.0
      min_turning_radius: 0.0
      lookup_table_size: 200
      cost_scaling_factor: 3.0
      reverse_penalty: 1.0
      change_penalty: 0.0
      non_straight_penalty: 0.0
      cost_quizzie_window: 5

behavior_server:
  ros__parameters:
    use_sim_time: false
    robot_base_frame: base_link
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
      sim_time: false
      min_rotational_vel: 0.1
      max_rotational_vel: 0.5
      rotational_acc_lim: 3.2
    backup:
      plugin: "nav2_behaviors/BackUp"
      sim_time: false
      backup_dist: 0.2
      backup_speed: 0.05
    wait:
      plugin: "nav2_behaviors/Wait"
      sim_time: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.2
      use_sim_time: false
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      #robot_radius: 0.25
      #多边形机器人，需要调
      footprint: "[ [0.4, 0.35], [0.4, -0.35], [-0.4, -0.35], [-0.4, 0.35] ]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /cloud_obstacles
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          min_obstacle_height: 0.05
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.36

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      transform_tolerance: 1.0
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      #robot_radius: 0.25
      footprint: "[ [0.4, 0.35], [0.4, -0.35], [-0.4, -0.35], [-0.4, 0.35] ]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /cloud_obstacles
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 5.0
          raytrace_max_range: 5.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.30

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05   
      yaw_goal_tolerance: 0.25  
      stateful: True            
    controller_plugins: ["FollowPath"]
    

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.3
      vy_std: 0.3
      wz_std: 0.4
      vx_max: 1.4
      vx_min: -1.4
      vy_max: 1.4
      vy_min: -1.4
      wz_max: 1.5
      iteration_count: 1
      prune_distance: 3.0
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"
      visualize: false
      
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PreferForwardCritic"]
      
      ConstraintCritic:
        plugin: "mppi::critics::ConstraintCritic"
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      
      ObstaclesCritic:
        plugin: "mppi::critics::ObstaclesCritic"
        enabled: true
        cost_power: 1
        repulsion_weight: 0.8
        critical_weight: 5.0
        consider_footprint: true
      
      GoalCritic:
        plugin: "mppi::critics::GoalCritic"
        enabled: true
        cost_power: 1
        cost_weight: 7.0
        threshold_to_consider: 1.4
      
      GoalAngleCritic:
        plugin: "mppi::critics::GoalAngleCritic"
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      
      PathAlignCritic:
        plugin: "mppi::critics::PathAlignCritic"
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: true
      
      PathFollowCritic:
        plugin: "mppi::critics::PathFollowCritic"
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      
      PreferForwardCritic:
        plugin: "mppi::critics::PreferForwardCritic"
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.5
velocity_smoother:
  ros__parameters:
    plugin: "nav2_velocity_smoother/VelocitySmoother"
    use_sim_time: false
    odom_topic: "/Odometry"
    odom_duration: 0.1
    smoothing_frequency: 20.0
    max_velocity: [1.5, 1.5, 2.0]    
    min_velocity: [-1.5, -1.5, -2.0] 
    max_accel: [6.0, 6.0, 1.5]      # 根据机器人实际性能调整（建议1.0~2.0）
    max_decel: [-3.0, -3.0, -1.5]    # 减速度限制，和加速度对称
    # 角速度限制（和controller_server的wz_max匹配）
    feedback: "CLOSED_LOOP" 
    # 关键：声明是全向轮机器人，不忽略y轴
    holonomic: true
    ode_solver: "RungeKutta2"
    smooth_time: 0.2
    # 坐标系（和你的配置保持一致）
    frame_id: "base_link"
 
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

param_handler:
  ros__parameters:
    use_sim_time: false

nav2_controller:
  ros__parameters:
    use_sim_time: false

nav2_costmap_2d:
  ros__parameters:
    use_sim_time: false

nav2_planner:
  ros__parameters:
    use_sim_time: false
