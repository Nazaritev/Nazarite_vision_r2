cloud_localizer:
  ros__parameters:
    # Restart after editing. map_file/backend/initial pose are supplied by launch.
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    voxel_leaf_size: 0.15
    min_points: 100
    scan_min_range: 0.5
    scan_max_range: 30.0
    max_iterations: 40
    correspondence_distance: 0.8
    ndt_resolution: 1.0
    ndt_step_size: 0.1
    min_inlier_ratio: 0.65
    max_rmse: 0.25
    required_consecutive_good: 3
    max_correction_distance: 1.5
    max_correction_angle: 0.8
    max_data_age_sec: 0.6
    input_timeout_sec: 1.0
    odom_sync_tolerance_sec: 0.03
    tf_conflict_check_sec: 2.0
