lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ['controller_server',
                 'planner_server',
                 'behavior_server',
                 'bt_navigator',
                 'global_costmap/global_costmap',
                 'local_costmap/local_costmap']

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /nav2_odom
    bt_loop_duration: 10
    default_nav_to_pose_bt_xml: "/home/dgut/Nazarite/src/rc_bringup/config/reality/navigate_to_pose_teb_mppi_selector.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.00
      max_iterations: 500000
      max_on_approach_iterations: 500
      allow_unknown: true
      use_final_approach_orientation: false
      motion_model: "OMNI"
      radius: 0.20
      analytical_expansion: true
      analytical_expansion_max_length: 1.5
      min_turning_radius: 0.0
      lookup_table_size: 50
      cost_scaling_factor: 5.0
      reverse_penalty: 1.0
      change_penalty: 0.0
      non_straight_penalty: 1.05
      cost_quizzie_window: 5

behavior_server:
  ros__parameters:
    use_sim_time: false
    robot_base_frame: base_link
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
      sim_time: false
      min_rotational_vel: 0.05
      max_rotational_vel: 0.20
      rotational_acc_lim: 0.5
    backup:
      plugin: "nav2_behaviors/BackUp"
      sim_time: false
      backup_dist: 0.12
      backup_speed: 0.30
    wait:
      plugin: "nav2_behaviors/Wait"
      sim_time: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.15
      use_sim_time: false
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.005
      footprint: "[ [0.144, 0.494], [0.144, -0.128], [-0.534, -0.128], [-0.534, 0.494] ]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /cloud_obstacles
          max_obstacle_height: 1.2
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          min_obstacle_height: 0.05
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 12.0
        inflation_radius: 0.25

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      transform_tolerance: 0.2
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.005
      footprint: "[ [0.144, 0.494], [0.144, -0.128], [-0.534, -0.128], [-0.534, 0.494] ]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /cloud_obstacles
          max_obstacle_height: 1.2
          clearing: True
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 6.0
          raytrace_max_range: 6.5
          min_obstacle_height: 0.05
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.34

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /nav2_odom
    controller_frequency: 50.0
    failure_tolerance: 1.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["grab_goal_checker", "shift_goal_checker", "pose_goal_checker"]
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.01
      movement_time_allowance: 100.0

    grab_goal_checker:
      plugin: "nav2_controller::PositionGoalChecker"
      xy_goal_tolerance: 0.05
      stateful: true

    shift_goal_checker:
      plugin: "nav2_controller::PositionGoalChecker"
      xy_goal_tolerance: 0.03
      stateful: true

    pose_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.524
      stateful: true

    controller_plugins: ["TEB_Short", "MPPI_Long"]

    TEB_Short:
      plugin: "teb_local_planner::TebLocalPlannerROS"
      teb_autosize: 1.0
      dt_ref: 0.12
      dt_hysteresis: 0.03
      min_samples: 3
      max_samples: 12
      global_plan_overwrite_orientation: false
      allow_init_with_backwards_motion: true
      max_global_plan_lookahead_dist: 0.5
      global_plan_viapoint_sep: -1.0
      global_plan_prune_distance: 0.2
      exact_arc_length: false
      feasibility_check_no_poses: 4
      publish_feedback: false

      max_vel_x: 0.8
      max_vel_x_backwards: 0.6
      max_vel_y: 0.8
      max_vel_theta: 0.10
      acc_lim_x: 1.2
      acc_lim_y: 1.2
      acc_lim_theta: 0.20

      footprint_model:
        type: "polygon"
        vertices: "[[0.144, 0.494], [0.144, -0.128], [-0.534, -0.128], [-0.534, 0.494]]"

      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.524
      free_goal_vel: false

      min_obstacle_dist: 0.10
      inflation_dist: 0.16
      include_costmap_obstacles: true
      costmap_obstacles_behind_robot_dist: 0.6
      obstacle_poses_affected: 10
      include_dynamic_obstacles: true

      no_inner_iterations: 4
      no_outer_iterations: 3
      optimization_activate: true
      optimization_verbose: false
      penalty_epsilon: 0.05
      obstacle_cost_exponent: 1.0
      weight_max_vel_x: 2.5
      weight_max_vel_y: 2.5
      weight_max_vel_theta: 2.5
      weight_acc_lim_x: 1.0
      weight_acc_lim_y: 1.0
      weight_acc_lim_theta: 1.2
      weight_kinematics_nh: 0.0
      weight_kinematics_forward_drive: 0.0
      weight_kinematics_turning_radius: 0.0
      weight_optimaltime: 3.0
      weight_shortest_path: 0.0
      weight_obstacle: 30.0
      weight_inflation: 0.1
      weight_dynamic_obstacle: 0.0
      weight_dynamic_obstacle_inflation: 0.0
      weight_viapoint: 1.0
      weight_adapt_factor: 2.0

      enable_homotopy_class_planning: false
      enable_multithreading: false
      max_number_classes: 1
      selection_cost_hysteresis: 1.0
      selection_prefer_initial_plan: 0.95
      selection_obst_cost_scale: 1.0
      selection_alternative_time_cost: false

      roadmap_graph_samples: 5
      roadmap_graph_area_width: 1.0
      roadmap_graph_area_length_scale: 1.0
      h_signature_prescaler: 0.5
      h_signature_threshold: 0.1
      obstacle_heading_threshold: 0.45
      switching_blocking_period: 0.0
      viapoints_all_candidates: false
      delete_detours_backwards: true
      max_ratio_detours_duration_best_duration: 2.0
      visualize_hc_graph: false
      visualize_with_time_as_z_axis_scale: 0.0

      shrink_horizon_backup: false
      shrink_horizon_min_duration: 2.0
      oscillation_recovery: false
      oscillation_v_eps: 0.02
      oscillation_omega_eps: 0.02
      oscillation_recovery_min_duration: 2.0
      oscillation_filter_duration: 2.0

    MPPI_Long:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 20
      model_dt: 0.02
      batch_size: 1200
      vx_std: 0.40
      vy_std: 0.40
      wz_std: 0.25
      vx_max: 1.60
      vx_min: -1.60
      vy_max: 1.60
      vy_min: -1.60
      wz_max: 0.45
      iteration_count: 1
      prune_distance: 1.2
      transform_tolerance: 0.2
      temperature: 0.25
      gamma: 0.015
      motion_model: "Omni"
      visualize: false

      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "TwirlingCritic"]

      ConstraintCritic:
        plugin: "mppi::critics::ConstraintCritic"
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      ObstaclesCritic:
        plugin: "mppi::critics::ObstaclesCritic"
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 10.0
        consider_footprint: true

      GoalCritic:
        plugin: "mppi::critics::GoalCritic"
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        threshold_to_consider: 1.2

      GoalAngleCritic:
        plugin: "mppi::critics::GoalAngleCritic"
        enabled: false
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.08

      PathAlignCritic:
        plugin: "mppi::critics::PathAlignCritic"
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 2
        threshold_to_consider: 0.4
        offset_from_furthest: 5
        use_path_orientations: false

      PathFollowCritic:
        plugin: "mppi::critics::PathFollowCritic"
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        offset_from_furthest: 3
        threshold_to_consider: 1.2

      TwirlingCritic:
        plugin: "mppi::critics::TwirlingCritic"
        enabled: true
        cost_power: 1
        cost_weight: 8.0

velocity_smoother:
  ros__parameters:
    plugin: "nav2_velocity_smoother/VelocitySmoother"
    use_sim_time: false
    odom_topic: "/nav2_odom"
    odom_duration: 0.1
    smoothing_frequency: 100.0
    max_velocity: [1.60, 1.60, 0.0]
    min_velocity: [-1.60, -1.60, -0.0]
    max_accel: [3.0, 3.0, 0.0]
    max_decel: [-6.0, -6.0, 0.0]
    feedback: "OPEN_LOOP"
    holonomic: true
    ode_solver: "RungeKutta2"
    smooth_time: 0.08
    frame_id: "base_link"
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    deadband_velocity: [0.0, 0.0, 0.0]

param_handler:
  ros__parameters:
    use_sim_time: false

nav2_controller:
  ros__parameters:
    use_sim_time: false

nav2_costmap_2d:
  ros__parameters:
    use_sim_time: false

nav2_planner:
  ros__parameters:
    use_sim_time: false
