amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: footprint_link
    scan_topic: /scan
    map_topic: /map
    tf_broadcast: true
    robot_model_type: nav2_amcl::OmniMotionModel
    set_initial_pose: false
    alpha1: 0.35
    alpha2: 0.35
    alpha3: 0.35
    alpha4: 0.35
    alpha5: 0.35
    laser_model_type: likelihood_field
    laser_min_range: 0.45
    laser_max_range: 10.0
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    min_particles: 500
    max_particles: 3000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.5
    z_rand: 0.5
    sigma_hit: 0.2