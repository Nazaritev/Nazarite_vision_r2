planner_server:
    ros__parameters:
        use_sim_time: False
        expected_planner_frequency: 10.0                 # 如果没有达到频率就输出警告，并不能真正改变频率
        planner_plugins: [ "GridBased" ]                 # 路径规划器的映射名
        GridBased:
            plugin: "nav2_navfn_planner/NavfnPlanner"
            tolerance: 1.0                               # 终点偏差的容忍值
            use_astar: false                             # 是否使用A*算法，否则使用Dijkstra算法
            allow_unknown: true                          # 是否允许在未知区域规划路径
            use_final_approach_orientation: false        # 终点是否使用设定的朝向

controller_server:
    ros__parameters:
        use_sim_time: False
        controller_frequency: 100.0                      # 速度发送频率（局部路径频率）
        publish_zero_velocity: True                      # 是否在目标没有之后发布0速度
        action_server_result_timeout: 10.0               # 行为服务器超时时间
        controller_plugins: [ "FollowPath" ]             # 处理请求和参数的控制器插件的映射名称列表
        progress_checker_plugin: "progress_checker"      # 进度检查器插件的映射名称
        goal_checker_plugins: [ "goal_checker" ]         # 检查目标是否达到的目标检查器插件的映射名称列表
        min_x_velocity_threshold: 0.01                   # 最小x轴速度阈值
        min_y_velocity_threshold: 0.01                   # 最小y轴速度阈值
        min_theta_velocity_threshold: 0.001              # 最小角速度阈值
        failure_tolerance: 0.5                           # FollowPath操作失败之前，控制器插件失败的最大容忍时间
        speed_limit_topic: "speed_limit"                 # 速度限制话题
        odom_topic: "/Odometry"                          # 获取速度瞬时测量值的话题
        enable_stamped_cmd_vel: False                    # True - 使用geometry_msgs::msg::TwistStamped消息类型，False - 使用geometry_msgs::msg::Twist消息类型
        bond_heartbeat_period: 0.1                       # 生命周期节点绑定机制发布周期

        progress_checker:
            plugin: "nav2_controller::SimpleProgressChecker"
            required_movement_radius: 0.30
            movement_time_allowance: 25.0

        goal_checker:
            stateful: True
            plugin: "nav2_controller::SimpleGoalChecker"
            xy_goal_tolerance: 0.10
            yaw_goal_tolerance: 3.1416

        FollowPath:
            plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
            desired_linear_vel: 1.0                           # 期望线速度
            lookahead_dist: 0.6                               # 前瞻点距离，use_velocity_scaled_lookahead_dist为false时有效
            use_velocity_scaled_lookahead_dist: true          # 是否根据速度控制前瞻点距离
            lookahead_time: 1.5                               # 前瞻点距离倍数，前瞻点距离=速度大小*lookahead_time
            min_lookahead_dist: 0.3                           # 最小前瞻点距离
            max_lookahead_dist: 0.9                           # 最大前瞻点距离
            transform_tolerance: 0.1                          # 坐标转换超时阈值，单位为秒
            use_rotate_to_heading: false                      # 是否调整好朝向再移动（全向底盘可关）
            allow_reversing: false                            # 是否允许倒车
            use_collision_detection: true                     # 是否使用局部代价地图做碰撞检测
            max_angular_accel: 3.2                            # 最大角加速度

velocity_smoother:
    ros__parameters:
        use_sim_time: False                  # 是否使用仿真时间
        smoothing_frequency: 100.0           # 输出速度频率，如果大于输入速度频率，则使用插值
        scale_velocities: False              # 如果当前加速度大于设定的加速度，是否对所有轴的速度都缩放
        feedback: "OPEN_LOOP"                # OPEN_LOOP为开环控制，CLOSE_LOOP为使用里程计进行闭环控制
        max_velocity: [ 3.0, 3.0, 4.0 ]      # 最大速度
        min_velocity: [ -3.0, -3.0, -4.0 ]   # 最小速度
        max_accel: [ 2.5, 2.5, 4.0 ]         # 最大加速度
        max_decel: [ -2.5, -2.5, -4.0 ]      # 最小加速度
        odom_topic: "/Odometry"              # 里程计话题，feedback为CLOSE_LOOP时使用
        odom_duration: 0.1                   # 里程计周期，feedback为CLOSE_LOOP时使用
        deadband_velocity: [ 0.0, 0.0, 0.0 ] # 死区速度，对于每个速度分量，速度大小小于死区速度，就会是0
        velocity_timeout: 0.5                # 如果这个时间内没有接收到速度，就会发送速度0

global_costmap:
    global_costmap:
        ros__parameters:
            use_sim_time: False
            update_frequency: 10.0
            publish_frequency: 2.0
            global_frame: map
            robot_base_frame: base_link
            robot_radius: 0.30
            resolution: 0.05
            track_unknown_space: true
            transform_tolerance: 2.0
            always_send_full_costmap: False
            plugins: [ "static_layer", "denoise_layer", "inflation_layer" ]
            static_layer:
                plugin: "nav2_costmap_2d::StaticLayer"
                map_subscribe_transient_local: True
            denoise_layer:
                plugin: "nav2_costmap_2d::DenoiseLayer"
                enabled: true
                minimal_group_size: 2
                group_connectivity_type: 8
            inflation_layer:
                plugin: "nav2_costmap_2d::InflationLayer"
                cost_scaling_factor: 2.8
                inflation_radius: 3.0

local_costmap:
    local_costmap:
        ros__parameters:
            use_sim_time: False
            update_frequency: 2.0
            publish_frequency: 1.0
            global_frame: odom
            robot_base_frame: base_link
            robot_radius: 0.30
            rolling_window: true
            width: 12
            height: 12
            resolution: 0.05
            track_unknown_space: true
            always_send_full_costmap: False
            plugins: [ "static_layer" ]
            static_layer:
                plugin: "nav2_costmap_2d::StaticLayer"
                map_subscribe_transient_local: True

map_server:
    ros__parameters:
        use_sim_time: False
        # Overridden in launch by the "map" launch configuration or provided default value.
        # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
        yaml_filename: ""

map_saver:
    ros__parameters:
        use_sim_time: False
        save_map_timeout: 5.0
        free_thresh_default: 0.25
        occupied_thresh_default: 0.65
        map_subscribe_transient_local: True

# https://docs.nav2.org/configuration/packages/configuring-bt-navigator.html#parameters
bt_navigator:
    ros__parameters:
        use_sim_time: False                 # 是否使用仿真环境的时间
        global_frame: map                   # 全局帧
        robot_base_frame: base_link         # 行为树XML描述的路径
        odom_topic: /Odometry               # 里程计发布的话题
        bt_loop_duration: 10                # BT执行每次迭代的持续时间（以毫秒为单位）。
        default_server_timeout: 20          # BT操作节点等待操作服务器确认时的默认超时值（以毫秒为单位）
        plugin_lib_names:                   # 行为树节点共享库列表
            - nav2_compute_path_to_pose_action_bt_node
            - nav2_compute_path_through_poses_action_bt_node
            - nav2_smooth_path_action_bt_node
            - nav2_follow_path_action_bt_node
            - nav2_spin_action_bt_node
            - nav2_wait_action_bt_node
            - nav2_assisted_teleop_action_bt_node
            - nav2_back_up_action_bt_node
            - nav2_drive_on_heading_bt_node
            - nav2_clear_costmap_service_bt_node
            - nav2_is_stuck_condition_bt_node
            - nav2_goal_reached_condition_bt_node
            - nav2_goal_updated_condition_bt_node
            - nav2_globally_updated_goal_condition_bt_node
            - nav2_is_path_valid_condition_bt_node
            - nav2_initial_pose_received_condition_bt_node
            - nav2_reinitialize_global_localization_service_bt_node
            - nav2_rate_controller_bt_node
            - nav2_distance_controller_bt_node
            - nav2_speed_controller_bt_node
            - nav2_truncate_path_action_bt_node
            - nav2_truncate_path_local_action_bt_node
            - nav2_goal_updater_node_bt_node
            - nav2_recovery_node_bt_node
            - nav2_pipeline_sequence_bt_node
            - nav2_round_robin_node_bt_node
            - nav2_transform_available_condition_bt_node
            - nav2_time_expired_condition_bt_node
            - nav2_path_expiring_timer_condition
            - nav2_distance_traveled_condition_bt_node
            - nav2_single_trigger_bt_node
            - nav2_goal_updated_controller_bt_node
            - nav2_is_battery_low_condition_bt_node
            - nav2_navigate_through_poses_action_bt_node
            - nav2_navigate_to_pose_action_bt_node
            - nav2_remove_passed_goals_action_bt_node
            - nav2_planner_selector_bt_node
            - nav2_controller_selector_bt_node
            - nav2_goal_checker_selector_bt_node
            - nav2_controller_cancel_bt_node
