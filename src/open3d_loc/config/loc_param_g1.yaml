global_localization_node:
  ros__parameters:
    loc_map: "scans_1.9_filtered_half_std_best_for_loc.pcd"

    pcd_queue_maxsize: 4
    save_scan: false
    maxpoints_source: 24000
    maxpoints_target: 80000

    loc_frequence: 0.2
    confidence_loc_th: 0.65
    filter_odom2map: false
    kalman_processVar2: 0.001
    kalman_estimatedMeasVar2: 0.02

    voxelsize_coarse: 0.10
